{% extends "projects/project_base.html" %}
{% load static crispy_forms_tags %}

{% block project_content %}
  <div class="slice py-5 bg-section-secondary">
    <div class="container-fluid">
      <div class="text-center">
        <div class="ratio ratio-16x9 mb-3">
          {% if object.strategy_pdf %}
            <h1>SEO Strategy - {{ object.project_name }}</h1>
            <embed src="{{ object.strategy_pdf.url }}" class="w-100 h-100" type="application/pdf">
          {% else %}
            <h1>Your SEO Strategy will be Available Here, Once Complete</h1>
            <embed src="{% static 'pdf/Thank-You.pdf' %}" width="800" height="500" type="application/pdf">
          {% endif %}
        </div>
        <hr />
        <button type="button" class="btn btn-animated btn-primary btn-animated-x">
          <span class="btn-inner--visible">Download</span>
          <span class="btn-inner--hidden">
            <i data-feather="arrow-right"></i>
          </span>
        </button>
      </div>
    </div>
  </div>
{% endblock project_content %}
