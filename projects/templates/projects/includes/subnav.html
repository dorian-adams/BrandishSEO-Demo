{% load static %}

<div id="sidebar-container" class="sidebar-expanded col-2 pt-10">

    <a href="#" class="bg-sidebar-label list-group-item list-group-item-action">
      <div class="d-flex w-100 justify-content-start align-items-center">

        <span class="menu-collapsed">Dashboard</span>
      </div>
    </a>

    <a href="#" class="bg-sidebar-label list-group-item list-group-item-action">
