<div class="kanban-task">
  <span class="mb-2 sub-text-purple">{{ task.task_title }}</span>
  <p class="text-muted mb-3" data-bs-toggle="tooltip" title="{{ task.task_description }}">
    {{ task.task_description }}
  </p>
  <span class="surtitle d-block ls-1 mb-n2">Progress</span>
  <div class="d-flex align-items-center">
    <div class="w-80 mr-2">
      <div class="progress progress-sm shadow-none">
        <div class="progress-bar bg-primary" role="progressbar" style="width: {{ task.progress }}%" aria-valuenow="{{ task.progress }}" aria-valuemin="0" aria-valuemax="100"></div>
      </div>
    </div>
    <span class="text-sm text-primary">{{ task.progress }}%</span>
  </div>
  <div class="row">
    <div class="col">
      <span class="surtitle d-block ls-1 mb-n2">
        Assigned to:
      </span>
    </div>
    <div class="col">
      <span class="surtitle d-block ls-1 mb-n2">
        Priority:
      </span>
    </div>
  </div>
  <div class="row">
    <div class="col">
      <span class="d-block ls-1 mt-1">
        {{ task.assigned_to.first_name }} {{ task.assigned_to.last_name }}
      </span>
    </div>
    <div class="col">
      <span class="d-block ls-1 mt-1">
        {{ task.priority }}
      </span>
    </div>
  </div>
</div>
<hr class="my-3" />
